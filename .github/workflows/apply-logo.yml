name: Apply 지문.zip logo

on:
  push:
    paths:
      - '.github/workflows/apply-logo.yml'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace header with cat logo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')

          if 'from logo_data import LOGO_DATA' not in text:
              text = text.replace(
                  'import time\n',
                  'import time\nfrom logo_data import LOGO_DATA\n',
                  1,
              )

          old = 'st.title("📚 지문.zip")'
          new = '''st.markdown(
              f"""
              <div style="display:flex; align-items:center; gap:12px; margin-bottom:0.5rem;">
                  <img src="{LOGO_DATA}" style="width:72px; height:72px; object-fit:contain;">
                  <span style="font-size:2.5rem; font-weight:700;">지문.zip</span>
              </div>
              """,
              unsafe_allow_html=True,
          )'''

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('Target title not found; no change made.')
          PY

      - name: Commit patched main.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet || git commit -m "feat: 지문.zip 고양이 로고 적용"
          git push
