name: Apply 지문.zip logo

on:
  push:
    paths:
      - '.github/workflows/apply-logo.yml'
      - 'main.py'
      - 'logo_data.py'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create logo image and apply header/favicon
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          data = Path('logo_data.py').read_text(encoding='utf-8')
          match = re.search(r"LOGO_DATA\s*=\s*['\"]data:image/[^;]+;base64,([^'\"]+)", data)
          if not match:
              raise SystemExit('LOGO_DATA not found')
          Path('logo.png').write_bytes(base64.b64decode(match.group(1)))

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('st.set_page_config(page_title="지문.zip", page_icon="📚", layout="wide")', 'st.set_page_config(page_title="지문.zip", page_icon="logo.png", layout="wide")', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py logo.png
          git diff --cached --quiet || git commit -m "feat: 지문.zip 고양이 로고를 앱 아이콘에도 적용"
          git push
